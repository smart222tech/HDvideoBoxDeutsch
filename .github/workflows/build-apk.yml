name: Build DeutschStream APK

on:
  push:
    paths:
      - "DeutschStream_Variante_C_Projekt.zip"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Unpack DeutschStream source
        run: |
          test -f DeutschStream_Variante_C_Projekt.zip
          unzip -q DeutschStream_Variante_C_Projekt.zip -d source
          test -f source/DeutschStream/settings.gradle.kts

      - name: Build debug APK
        working-directory: source/DeutschStream
        run: gradle --no-daemon assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DeutschStream-debug-apk
          path: source/DeutschStream/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
